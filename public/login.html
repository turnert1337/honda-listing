<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Listing</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f4f6f8;color:#101418;padding:20px}
.box{background:#fff;padding:32px 28px;border-radius:16px;width:320px;max-width:100%;text-align:center;box-shadow:0 12px 40px rgba(16,20,24,.10);border:1px solid #e3e7eb}
.brand{font-weight:700;font-size:20px}.sub{color:#5b6570;font-size:13px;margin-top:2px}
input{width:100%;padding:13px 14px;border:1.5px solid #e3e7eb;border-radius:12px;font-size:16px;margin:18px 0 6px;outline:none}input:focus{border-color:#1256b8}
.err{color:#c0392b;font-size:13px;height:18px}
button{width:100%;padding:13px;border:0;border-radius:999px;background:#1256b8;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
</style></head><body>
<form class="box" id="f"><div class="brand">🚗 Car listing</div><div class="sub">Enter the password from the invite</div>
<input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus><div class="err" id="err"></div><button type="submit">View listing</button></form>
<script>
document.getElementById('f').addEventListener('submit',async(ev)=>{ev.preventDefault();const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('pw').value})});if(r.ok)location.href='/';else{document.getElementById('err').textContent='Nope. Try again.';document.getElementById('pw').value='';}});
</script></body></html>
