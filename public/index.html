<!DOCTYPE html>
<html lang="en" data-theme="clean">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2018 Honda Accord Hybrid — For Sale</title>
<meta name="description" content="One-owner 2018 Honda Accord Hybrid, 47 mpg, full dealer service history, Fayetteville AR.">
<meta name="robots" content="noindex">
<style>
  /* ---------- tokens per theme ---------- */
  :root[data-theme="clean"]{
    --bg:#ffffff; --bg2:#f4f6f8; --ink:#101418; --ink2:#5b6570; --line:#e3e7eb;
    --accent:#1256b8; --accent-ink:#fff; --card:#fff; --radius:14px;
    --font:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif; --display:var(--font);
    --shadow:0 8px 30px rgba(16,20,24,.08);
  }
  :root[data-theme="dark"]{
    --bg:#0f1114; --bg2:#171a1f; --ink:#f2f3f5; --ink2:#9aa3ad; --line:#262b32;
    --accent:#f5a524; --accent-ink:#151515; --card:#171a1f; --radius:16px;
    --font:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif; --display:var(--font);
    --shadow:0 12px 40px rgba(0,0,0,.45);
  }
  :root[data-theme="editorial"]{
    --bg:#f7f3ec; --bg2:#efe8dc; --ink:#22201c; --ink2:#6b655b; --line:#ddd4c5;
    --accent:#8a2f1d; --accent-ink:#fff; --card:#fffdf8; --radius:6px;
    --font:"Georgia","Iowan Old Style","Palatino",serif; --display:"Georgia","Iowan Old Style",serif;
    --shadow:0 6px 24px rgba(60,40,20,.10);
  }
  /* ---------- base ---------- */
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:var(--accent)}
  .wrap{max-width:960px;margin:0 auto;padding:0 16px}
  section{padding:40px 0}
  h1{font-family:var(--display);font-size:clamp(28px,6vw,44px);line-height:1.1;margin:0 0 6px;letter-spacing:-.01em}
  h2{font-family:var(--display);font-size:clamp(20px,4vw,26px);margin:0 0 16px}
  .muted{color:var(--ink2)}
  /* hero */
  .hero{padding:28px 0 8px}
  .hero-img{aspect-ratio:16/10;width:100%;border-radius:var(--radius);object-fit:cover;background:var(--bg2);display:block;box-shadow:var(--shadow)}
  .hero-ph{aspect-ratio:16/10;border-radius:var(--radius);background:linear-gradient(135deg,var(--bg2),var(--line));display:grid;place-items:center;color:var(--ink2);font-size:14px}
  .titlebar{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:20px}
  .price{font-family:var(--display);font-size:clamp(28px,6vw,40px);font-weight:700;letter-spacing:-.02em}
  .price small{display:block;font-size:13px;font-weight:400;color:var(--ink2);letter-spacing:0}
  .badge{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
  .badge.sold{background:#777}
  /* highlights */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
  .hl{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
  .hl b{display:block;font-size:18px;font-family:var(--display)}
  .hl span{font-size:13px;color:var(--ink2)}
  /* gallery */
  .gallery{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;-webkit-overflow-scrolling:touch;margin:0 -16px;padding-left:16px;padding-right:16px}
  .gallery img{flex:0 0 84%;max-width:420px;aspect-ratio:4/3;object-fit:cover;border-radius:var(--radius);scroll-snap-align:center;background:var(--bg2);cursor:zoom-in}
  @media(min-width:640px){.gallery{display:grid;grid-template-columns:repeat(3,1fr);overflow:visible;margin:0;padding:0}.gallery img{flex:none;max-width:none;width:100%}#damageGallery{grid-template-columns:repeat(4,1fr)}}
  /* tables */
  table{width:100%;border-collapse:collapse;font-size:15px}
  td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  td:first-child{color:var(--ink2);width:34%}
  .svc td:nth-child(2){white-space:nowrap;color:var(--ink2);width:auto}
  /* disclosures */
  .disc li{margin:6px 0}
  /* cta */
  .cta{background:var(--bg2);border-radius:var(--radius);padding:24px;text-align:center}
  .btn{display:inline-block;padding:14px 26px;border-radius:999px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:700;margin:6px}
  .sticky{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:5;backdrop-filter:blur(8px)}
  .sticky .btn{padding:10px 18px;margin:0}
  @media(min-width:640px){.sticky{display:none}}
  body{padding-bottom:70px}
  @media(min-width:640px){body{padding-bottom:0}}
  /* lightbox */
  .lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;place-items:center;z-index:9}
  .lb.on{display:grid}
  .lb img{max-width:96vw;max-height:92vh;object-fit:contain}
  /* theme picker (local only) */
  .picker{position:fixed;top:10px;right:10px;z-index:8;display:none;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
  .picker.on{display:flex}
  .picker button{border:0;background:transparent;color:var(--ink);padding:6px 10px;border-radius:999px;font-size:12px;cursor:pointer}
  .picker button.cur{background:var(--accent);color:var(--accent-ink)}
  footer{padding:30px 0 40px;font-size:12px;color:var(--ink2);text-align:center}
</style>
</head>
<body>
<div class="picker" id="picker">
  <button data-t="clean">Clean</button><button data-t="dark">Dark</button><button data-t="editorial">Editorial</button>
</div>

<div class="wrap">
  <section class="hero">
    <div id="heroImg"></div>
    <div class="titlebar">
      <div>
        <span class="badge" id="status">For sale</span>
        <h1 id="title"></h1>
        <div class="muted" id="subtitle"></div>
      </div>
      <div class="price" id="price"></div>
    </div>
  </section>

  <section>
    <div class="grid" id="highlights"></div>
  </section>

  <section id="photosSec">
    <h2>Photos</h2>
    <div class="gallery" id="gallery"></div>
  </section>

  <section>
    <h2>Specs</h2>
    <table id="specs"></table>
  </section>

  <section>
    <h2>Service history</h2>
    <p class="muted" id="svcNote">Every visit at Honda of Fayetteville. Invoices available on request.</p>
    <table class="svc" id="service"></table>
  </section>

  <section>
    <h2>Known wear &amp; disclosures</h2>
    <ul class="disc" id="disclosures"></ul>
    <div class="gallery" id="damageGallery" style="margin-top:16px"></div>
  </section>

  <section id="includedSec">
    <h2>What comes with it</h2>
    <ul class="disc" id="included"></ul>
  </section>

  <section>
    <div class="cta">
      <h2>Interested?</h2>
      <p class="muted" id="ctaText"></p>
      <div id="ctaBtns"></div>
    </div>
  </section>
  <footer id="foot"></footer>
</div>

<div class="sticky" id="sticky"><div><b id="sPrice"></b><div class="muted" style="font-size:12px" id="sMiles"></div></div><a class="btn" id="sBtn" href="#">Contact</a></div>
<div class="lb" id="lb"><img id="lbImg" alt=""></div>

<script>
const $ = (s) => document.querySelector(s);
const money = (n) => '$' + n.toLocaleString('en-US');
const miles = (n) => n.toLocaleString('en-US') + ' mi';

// theme: ?theme=x overrides; picker shows on localhost or ?pick=1
const q = new URLSearchParams(location.search);
const saved = q.get('theme') || localStorage.getItem('theme');
if (saved) document.documentElement.dataset.theme = saved;
if (location.hostname === 'localhost' || q.get('pick')) $('#picker').classList.add('on');
document.querySelectorAll('.picker button').forEach((b) => {
  b.classList.toggle('cur', b.dataset.t === document.documentElement.dataset.theme);
  b.onclick = () => { document.documentElement.dataset.theme = b.dataset.t; localStorage.setItem('theme', b.dataset.t); document.querySelectorAll('.picker button').forEach((x) => x.classList.toggle('cur', x === b)); };
});

async function main() {
  const [L, photos] = await Promise.all([fetch('/api/listing').then((r) => r.json()), fetch('/api/photos').then((r) => r.json())]);
  document.title = L.title + ' — For Sale';
  $('#title').textContent = L.title;
  $('#subtitle').textContent = L.subtitle;
  $('#status').textContent = L.status === 'sold' ? 'Sold' : L.status === 'pending' ? 'Sale pending' : 'For sale';
  if (L.status !== 'available') $('#status').classList.add('sold');
  $('#price').innerHTML = money(L.price) + '<small>' + L.price_note + '</small>';
  $('#sPrice').textContent = money(L.price); $('#sMiles').textContent = miles(L.mileage) + ' · ' + L.location;

  $('#heroImg').innerHTML = photos.length ? `<img class="hero-img" src="/photos/${photos.filter((p) => !p.startsWith('9'))[0]}" alt="${L.title}">` : `<div class="hero-ph">photos coming</div>`;
  $('#highlights').innerHTML = L.highlights.map((h) => `<div class="hl"><b>${h.k}</b><span>${h.v}</span></div>`).join('');
  const main = photos.filter((p) => !p.startsWith('9')), dmg = photos.filter((p) => p.startsWith('9'));
  if (main.length > 1) $('#gallery').innerHTML = main.slice(1).map((p) => `<img src="/photos/${p}" loading="lazy" alt="">`).join('');
  else $('#photosSec').style.display = 'none';
  $('#damageGallery').innerHTML = dmg.map((p) => `<img src="/photos/${p}" loading="lazy" alt="">`).join('');
  if (L.included && L.included.length) $('#included').innerHTML = L.included.map((d) => `<li>${d}</li>`).join(''); else $('#includedSec').style.display = 'none';
  $('#specs').innerHTML = L.specs.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('');
  $('#service').innerHTML = L.service.map(([d, m, w]) => `<tr><td>${d}</td><td>${m}</td><td>${w}</td></tr>`).join('');
  $('#disclosures').innerHTML = L.disclosures.map((d) => `<li>${d}</li>`).join('');
  const c = L.contact;
  $('#ctaText').textContent = `${c.method}. Located in ${L.location}. VIN ${L.vin}.`;
  const btns = [];
  if (c.phone) btns.push(`<a class="btn" href="sms:${c.phone.replace(/\D/g, '')}">Text ${c.name}</a>`);
  if (c.email) btns.push(`<a class="btn" href="mailto:${c.email}?subject=${encodeURIComponent(L.title)}">Email ${c.name}</a>`);
  $('#ctaBtns').innerHTML = btns.join('');
  $('#sBtn').href = c.phone ? `sms:${c.phone.replace(/\D/g, '')}` : `mailto:${c.email}`;
  $('#foot').textContent = L.docs_note;
  document.querySelectorAll('.gallery img, .hero-img').forEach((img) => img.onclick = () => { $('#lbImg').src = img.src; $('#lb').classList.add('on'); });
  $('#lb').onclick = () => $('#lb').classList.remove('on');
}
main();
</script>
</body>
</html>
